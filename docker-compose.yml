services:
  embeddings-api:
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.7}
    platform: linux/amd64
    pull_policy: always
    container_name: embeddings-api
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - ./data:/data
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    command:
      - --model-id
      - ${MODEL_ID:-Alibaba-NLP/gte-multilingual-base}
      - --dtype
      - ${DTYPE:-float16}
      - --max-batch-tokens
      - ${MAX_BATCH_TOKENS:-2048}
      - --max-client-batch-size
      - ${MAX_CLIENT_BATCH_SIZE:-8}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
